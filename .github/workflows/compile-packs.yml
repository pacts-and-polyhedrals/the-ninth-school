name: Compile Packs & Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install fvtt-cli
        run: npm install -g @foundryvtt/foundryvtt-cli

      - name: Compile packs
        run: |
          for pack in actors spells subclasses-and-features lore; do
            echo "Compiling $pack..."
            fvtt package workon "the-ninth-school" --type Module 2>/dev/null || true
            fvtt package pack \
              --inputDirectory "src/packs/$pack" \
              --outputDirectory "packs/$pack" \
              --compileType json 2>/dev/null || \
            fvtt package pack \
              --in "src/packs/$pack" \
              --out "packs/$pack" || true
          done

      - name: Verify packs compiled
        run: |
          for pack in actors spells subclasses-and-features lore; do
            if [ -d "packs/$pack" ]; then
              echo "✓ packs/$pack exists"
            else
              echo "✗ packs/$pack MISSING"
            fi
          done

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          zip -r "the-ninth-school-${TAG}.zip" . \
            -x "*.git*" \
            -x "src/*" \
            -x ".github/*" \
            -x "*/LOCK" \
            -x "node_modules/*"
          echo "Created the-ninth-school-${TAG}.zip"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "the-ninth-school-*.zip"
          generate_release_notes: false
